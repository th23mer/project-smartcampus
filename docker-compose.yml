# SmartCampus AI : services Docker Compose.
# SA-16 (E2) : services `db` (développement) et `db-test` (tests automatisés).
# SA-9  (E1) : services `backend`, `frontend`, `mailpit` (démarrés par défaut) ;
#              `worker` (profil worker), `seaweedfs` (profil seaweedfs), `mlflow` (profil mlflow).
#
# Toutes les valeurs viennent du fichier `.env` (copie locale de `.env.example`, jamais commitée).
# Ports hôtes : variables *_HOST_PORT avec valeurs standard par défaut (surcharger dans .env).
# Lancement : make up   (ou docker compose up -d --wait)   ;   voir `make help`.
# Base seule : docker compose up -d db db-test   puis   infra/db/check_db.sh

name: smartcampus

x-postgres-common: &postgres-common
  image: pgvector/pgvector:pg16          # PostgreSQL 16 + pgvector (ADR-03, SA-4 D15)
  restart: unless-stopped
  environment: &postgres-env
    # Superutilisateur d'administration : sert UNIQUEMENT aux scripts d'init et à la maintenance.
    POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256"
    # Mots de passe des trois rôles applicatifs (lus par infra/db/init/01-roles.sh).
    SMARTCAMPUS_OWNER_PASSWORD: ${SMARTCAMPUS_OWNER_PASSWORD:?SMARTCAMPUS_OWNER_PASSWORD manquant dans .env}
    SMARTCAMPUS_APP_PASSWORD: ${SMARTCAMPUS_APP_PASSWORD:?SMARTCAMPUS_APP_PASSWORD manquant dans .env}
    SMARTCAMPUS_RAG_READER_PASSWORD: ${SMARTCAMPUS_RAG_READER_PASSWORD:?SMARTCAMPUS_RAG_READER_PASSWORD manquant dans .env}
    TZ: Africa/Tunis
    PGTZ: Africa/Tunis
  healthcheck:
    # Prêt = le serveur accepte les connexions TCP (donc les scripts d'init sont finis) ET l'init
    # a réussi (pgcrypto, créée en dernier par 01-roles.sh, existe). Sans le 2e test, une init
    # ratée laisserait un volume à moitié initialisé que le conteneur redémarré dirait « healthy ».
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc \"SELECT 1 FROM pg_extension WHERE extname = 'pgcrypto'\" | grep -q 1"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  db:
    <<: *postgres-common
    container_name: smartcampus-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: ${POSTGRES_DB:-smartcampus}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro

  db-test:
    <<: *postgres-common
    container_name: smartcampus-db-test
    environment:
      <<: *postgres-env
      POSTGRES_DB: ${POSTGRES_TEST_DB:-smartcampus_test}
    ports:
      - "127.0.0.1:${DB_TEST_HOST_PORT:-5433}:5432"
    # Base de test jetable : données en mémoire, réinitialisée à chaque redémarrage du conteneur.
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro

  # ------------------------------------------------------------------------------------------
  # SA-9 : application. Dans les conteneurs, la base est joignable à db:5432 / db-test:5432
  # (réseau Compose), quel que soit le port publié sur l'hôte.
  # ------------------------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: dev
      args:
        # UID/GID de l'utilisateur du conteneur = ceux du développeur (fichiers créés dans le
        # volume monté). `make` les remplit avec `id -u` / `id -g` ; 1000 par défaut.
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: smartcampus-backend:dev
    container_name: smartcampus-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Liste EXPLICITE des variables : le mot de passe superutilisateur (POSTGRES_PASSWORD) n'entre
    # jamais dans le conteneur de l'appli. Ajouter ici toute nouvelle variable du backend
    # (ex. clé d'API du LLM, E4) en plus de .env.example.
    environment: &backend-env
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-false}
      # Secret de signature des jetons d'accès (SA-28). Vide : connexion indisponible (503).
      JWT_SECRET: ${JWT_SECRET:-}
      # Le navigateur appelle l'API depuis l'origine du frontend publiée sur l'hôte.
      CORS_ORIGINS: '["http://localhost:${FRONTEND_HOST_PORT:-3000}","http://127.0.0.1:${FRONTEND_HOST_PORT:-3000}"]'
      DATABASE_URL: postgresql+asyncpg://smartcampus_app:${SMARTCAMPUS_APP_PASSWORD}@db:5432/${POSTGRES_DB:-smartcampus}
      MIGRATION_DATABASE_URL: postgresql+psycopg://smartcampus_owner:${SMARTCAMPUS_OWNER_PASSWORD}@db:5432/${POSTGRES_DB:-smartcampus}
      RAG_READER_DATABASE_URL: postgresql+asyncpg://smartcampus_rag_reader:${SMARTCAMPUS_RAG_READER_PASSWORD}@db:5432/${POSTGRES_DB:-smartcampus}
      TEST_DATABASE_URL: postgresql+asyncpg://smartcampus_app:${SMARTCAMPUS_APP_PASSWORD}@db-test:5432/${POSTGRES_TEST_DB:-smartcampus_test}
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://smartcampus_owner:${SMARTCAMPUS_OWNER_PASSWORD}@db-test:5432/${POSTGRES_TEST_DB:-smartcampus_test}
      TEST_RAG_READER_DATABASE_URL: postgresql+asyncpg://smartcampus_rag_reader:${SMARTCAMPUS_RAG_READER_PASSWORD}@db-test:5432/${POSTGRES_TEST_DB:-smartcampus_test}
      # E-mails sortants (jobs `email`, E3/E5) : capturés par Mailpit en dev, rien ne part.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-no-reply@smartcampus.example}
    ports:
      # 127.0.0.1 seulement : l'auth simulée X-Dev-* ne doit pas être joignable depuis le réseau.
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      # Code monté pour le rechargement à chaud ; l'environnement Python est dans /opt/venv.
      - ./backend:/app

  # File de jobs (ADR-06, table `job` + FOR UPDATE SKIP LOCKED). Le module n'existe pas encore :
  # commande provisoire qui s'arrête aussitôt. Quand le worker sera livré, remplacer `command`
  # par  ["uv", "run", "--frozen", "python", "-m", "app.jobs.worker"]  et retirer le profil.
  worker:
    image: smartcampus-backend:dev
    build:
      context: ./backend
      target: dev
      args:
        # UID/GID de l'utilisateur du conteneur = ceux du développeur (fichiers créés dans le
        # volume monté). `make` les remplit avec `id -u` / `id -g` ; 1000 par défaut.
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: smartcampus-worker
    profiles: ["worker"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment: *backend-env
    volumes:
      - ./backend:/app
    healthcheck:
      disable: true
    command: ["sh", "-c", "echo \"[worker] pas encore livré (ADR-06) : remplacer la commande par uv run python -m app.jobs.worker\""]

  frontend:
    build:
      context: ./frontend
      target: dev
      # NEXT_PUBLIC_* sont figées dans le JS au `next build` : arguments de build (cible prod)…
      args: &next-public
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${BACKEND_HOST_PORT:-8000}}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-dev}
        NEXT_PUBLIC_CHAT_MOCK: ${NEXT_PUBLIC_CHAT_MOCK:-false}
    image: smartcampus-frontend:dev
    container_name: smartcampus-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    # … et variables d'environnement, relues par `next dev` à chaque démarrage.
    # L'URL de l'API est celle vue par le NAVIGATEUR (port hôte), pas http://backend:8000.
    environment:
      <<: *next-public
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      # Décommenter si le rechargement à chaud ne voit pas les modifications (macOS, Windows/WSL).
      # WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # Volumes anonymes : les node_modules et le cache .next de l'IMAGE masquent ceux de l'hôte.
      - /app/node_modules
      - /app/.next

  # Boîte aux lettres de dev : capture tous les e-mails (SMTP 1025), interface web 8025.
  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: smartcampus-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      TZ: Africa/Tunis
    ports:
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"

  # ------------------------------------------------------------------------------------------
  # Services optionnels (désactivés par défaut) : docker compose --profile seaweedfs up -d
  # ------------------------------------------------------------------------------------------
  # Stockage objet compatible S3 (ADR-05 : disque local par défaut, S3 seulement si utile).
  # SeaweedFS remplace MinIO, prévu au départ : MinIO ne publie plus d'images Docker gratuites
  # depuis octobre 2025 (minio/minio et quay.io inaccessibles le 16/11/2026). SeaweedFS est une
  # passerelle S3 compatible (licence Apache-2.0) : même API S3 côté code (FileStorage).
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    container_name: smartcampus-seaweedfs
    profiles: ["seaweedfs"]
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-master.volumeSizeLimitMB=256", "-volume.max=0"]
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_HOST_PORT:-9000}:9000"
    volumes:
      - seaweedfs_data:/data

  # Suivi des expériences (comparaison LLM, LoRA, STT, évals RAG ; SA-4 conventions).
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    container_name: smartcampus-mlflow
    profiles: ["mlflow"]
    restart: unless-stopped
    # 1 seul processus : par défaut MLflow en lance 4, trop gourmand pour un poste étudiant.
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1",
              "--backend-store-uri", "sqlite:////mlflow/mlflow.db",
              "--artifacts-destination", "/mlflow/artifacts",
              "--allowed-hosts", "localhost:*,127.0.0.1:*,mlflow:*"]
    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow

volumes:
  db_data:
  seaweedfs_data:
  mlflow_data:
